# Déploiement : un seul compose pour le front Nuxt (SSR) et l'API Node, SQLite sur un volume.
#
#   docker compose up -d --build           (variables : voir .env.example)
#   docker compose -f compose.yaml -f compose.local.yaml up --build   (test local sur :8080)
#
# Seul « web » doit être exposé publiquement (domaine → service web, port 3000). L'API n'est
# joignable que depuis le réseau du compose, via le proxy /api de Nuxt. Guide : DEPLOY.md.

name: picross

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Obligatoire : openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?définissez JWT_SECRET (openssl rand -base64 48)}
      # Emails (séparés par des virgules) promus administrateurs à leur connexion.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # true : les grilles créées sont publiées sans modération.
      AUTO_VALIDATE: ${AUTO_VALIDATE:-false}
      # Derrière Nuxt/Traefik : on lit l'IP réelle dans X-Forwarded-For (rate limiting).
      TRUST_PROXY: 'true'
      # Mettre false uniquement pour tester en HTTP simple (cf. compose.local.yaml).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - picross-data:/data
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # URL publique, SANS slash final : sert aux canonical, hreflang, sitemap, Open Graph.
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:?définissez SITE_URL (ex. https://picross.mondomaine.fr)}
      # Adresse interne de l'API (réseau du compose).
      NUXT_API_URL: http://api:3000
    expose:
      - '3000'

volumes:
  picross-data:
